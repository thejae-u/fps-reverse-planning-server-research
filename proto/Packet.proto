syntax = "proto3";

package Protocol;

enum PacketType {
  // status response
  PacketOk = 0;
  InvalidData = 1;
  ErrorOccured = 2;

  // Tcp
  InfoHandshake = 101;
  Ping = 102;

  // Udp
  Ingame = 200;
  Authentication = 201;
}

enum IngameType {
  IngameOk = 0;
  Move = 1;
  Jump = 2;
  Shoot = 3;
  Hit = 4;
  LagComp = 5;
  Score = 6;
}

enum AuthenticationType {
  AuthenticationOk = 0;
  UdpHolePunching = 1;
}

message NetworkPacket {
  PacketType type = 1;
  bytes data = 2;
}

message InfoHandshakePacket {
  bytes sessionId = 1;
  int32 presetId = 2;
  int32 teamId = 3;
  float spawnX = 4;
  float spawnY = 5;
  float spawnZ = 6;
  float moveSpeed = 7;
  float sprintSpeed = 8;
  float jumpSpeed = 9;
  float gravity = 10;
  int32 maxHp = 11;
  int32 attackPower = 12;
  int32 maxAmmo = 13;
}

message IngamePacket {
  bytes sessionId = 1;
  bytes roomId = 2;
  IngameType method = 3;
  bytes data = 4;
  uint64 clientTick = 5;
}

message AuthenticationPacket {
  bytes sessionId = 1;
  bytes roomId = 2;
  AuthenticationType method = 3;
  bytes data = 4;
}

message HitPacket {
  bytes hitPlayerId = 1;
  bytes shooterId = 2;
  int32 currentHp = 3;
  int32 deaths = 4;
  bool isDead = 5;
  int32 damage = 6;
}

message LagCompTarget {
  bytes targetId = 1;
  float presentX = 2;
  float presentY = 3;
  float presentZ = 4;
  float rewoundX = 5;
  float rewoundY = 6;
  float rewoundZ = 7;
  bool isHit = 8;
}

message LagCompPacket {
  bytes shooterId = 1;
  float originX = 2;
  float originY = 3;
  float originZ = 4;
  float dirX = 5;
  float dirY = 6;
  float dirZ = 7;
  repeated LagCompTarget targets = 8;
}

message MovePacket {
  bytes playerId = 1;
  float originX = 2;
  float originY = 3;
  float originZ = 4;
  float dirX = 5;
  float dirY = 6;
  float dirZ = 7;
}

message Scoreboard {
  bytes playerId = 1;
  int32 kill = 2;
  int32 death = 3;
  int32 heal = 4;
}

message ScoreboardPacket {
  bytes roomId = 1;
  repeated Scoreboard scores = 2;
}
