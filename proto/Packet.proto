syntax = "proto3";

package Protocol;

enum PacketType {
  // status response
  PacketOk = 0;
  InvalidData = 1;
  ErrorOccured = 2;

  // Tcp
  InfoHandshake = 101;
  Ping = 102;
  EndGame = 103;
  PingRtt = 104;

  // Udp
  Ingame = 200;
  Authentication = 201;
  // SERVER_BENCHMARK=1인 테스트 서버만 반환하는 입력 처리 확인 응답
  BenchmarkAck = 202;
}

enum IngameType {
  IngameOk = 0;
  Move = 1;
  Jump = 2;
  Shoot = 3;
  Hit = 4;
  LagComp = 5;
  Score = 6;
  MatchEnd = 7;
}

enum AuthenticationType {
  AuthenticationOk = 0;
  UdpHolePunching = 1;
}

message NetworkPacket {
  PacketType type = 1;
  bytes data = 2;
}

// Network 제어 메시지. 서버 관측 RTT에는 큐 대기와 양쪽 처리 시간이 포함된다.
message PingRttPacket {
  uint64 sequence = 1;
  uint64 microseconds = 2;
}

message PlayerInitInfo {
  bytes playerId = 1;
  int32 teamId = 2;
  float spawnX = 3;
  float spawnY = 4;
  float spawnZ = 5;
}

message InfoHandshakePacket {
  bytes sessionId = 1;
  int32 presetId = 2;
  int32 teamId = 3;
  float spawnX = 4;
  float spawnY = 5;
  float spawnZ = 6;
  float moveSpeed = 7;
  float sprintSpeed = 8;
  float jumpSpeed = 9;
  float gravity = 10;
  int32 maxHp = 11;
  int32 attackPower = 12;
  int32 maxAmmo = 13;
  repeated PlayerInitInfo players = 14;
}

message IngamePacket {
  bytes sessionId = 1;
  bytes roomId = 2;
  IngameType method = 3;
  bytes data = 4;
  uint64 clientTick = 5;
  // 기본값 0은 일반 게임 입력. 벤치마크에서만 사용하는 식별자
  uint64 benchmarkSequence = 6;
}

message AuthenticationPacket {
  bytes sessionId = 1;
  bytes roomId = 2;
  AuthenticationType method = 3;
  bytes data = 4;
}

message HitPacket {
  bytes hitPlayerId = 1;
  bytes shooterId = 2;
  int32 currentHp = 3;
  int32 deaths = 4;
  bool isDead = 5;
  int32 damage = 6;
}

message LagCompTarget {
  bytes targetId = 1;
  float presentX = 2;
  float presentY = 3;
  float presentZ = 4;
  float rewoundX = 5;
  float rewoundY = 6;
  float rewoundZ = 7;
  bool isHit = 8;
}

message LagCompPacket {
  bytes shooterId = 1;
  float originX = 2;
  float originY = 3;
  float originZ = 4;
  float dirX = 5;
  float dirY = 6;
  float dirZ = 7;
  repeated LagCompTarget targets = 8;
}

message MovePacket {
  bytes playerId = 1;
  float originX = 2;
  float originY = 3;
  float originZ = 4;
  float dirX = 5;
  float dirY = 6;
  float dirZ = 7;
}

message Scoreboard {
  bytes playerId = 1;
  int32 kill = 2;
  int32 death = 3;
  int32 heal = 4;
  int32 teamId = 5;
  int32 damage = 6;
}

message ScoreboardPacket {
  bytes roomId = 1;
  repeated Scoreboard scores = 2;
  int32 winningTeam = 3;
  int32 teamAScore = 4;
  int32 teamBScore = 5;
}

// 모든 시간은 서버의 steady_clock으로 측정한 구간 길이이며 클라이언트 시계와 비교하지 않음.
message BenchmarkAckPacket {
  bytes sessionId = 1;
  uint64 sequence = 2;
  uint64 gameDispatchUs = 3;
  uint64 inputQueueUs = 4;
  uint64 inputProcessingUs = 5;
  uint64 tickExecutionUs = 6;
  bool accepted = 7;
  uint64 queueDepth = 8;
  uint64 tick = 9;
  bool stateSuperseded = 10;
  // World 큐 등록 시 다음 tick 예정 시각과의 차이를 양수 구간으로 분리
  uint64 nextTickRemainingUs = 11;
  uint64 tickOverdueAtEnqueueUs = 12;
  uint64 queueToTickStartUs = 13;
  uint64 tickStartLatenessUs = 14;
  uint64 withinTickWaitUs = 15;
  bool tickAnchorReset = 16;
  uint64 timerHandlerLatenessUs = 17;
  uint64 strandDispatchUs = 18;
  uint64 tickEntryUs = 19;
}
