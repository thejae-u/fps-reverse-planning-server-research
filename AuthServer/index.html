<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuthServer Match Test UI</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-2: #1f2937;
            --line: #374151;
            --text: #f9fafb;
            --muted: #9ca3af;
            --ok: #10b981;
            --warn: #f59e0b;
            --bad: #ef4444;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            max-width: 1480px;
            margin: 0 auto;
            padding: 20px;
        }

        h1,
        h2,
        h3,
        h4,
        p {
            margin-top: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 12px;
        }

        .col-2 {
            grid-column: span 2;
        }

        .col-3 {
            grid-column: span 3;
        }

        .col-4 {
            grid-column: span 4;
        }

        .col-6 {
            grid-column: span 6;
        }

        .col-12 {
            grid-column: span 12;
        }

        @media (max-width: 960px) {

            .col-2,
            .col-3,
            .col-4,
            .col-6,
            .col-12 {
                grid-column: span 12;
            }
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        input,
        button,
        textarea,
        select {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            font-weight: 700;
            transition: background-color .15s ease, transform .05s ease;
        }

        button:hover {
            background: #273449;
        }

        button:active {
            transform: translateY(1px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .actions button {
            width: auto;
            min-width: 120px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        @media (max-width: 1180px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .client-card {
            background: #182234;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
        }

        .top-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .status.idle {
            background: rgba(156, 163, 175, .15);
            color: #d1d5db;
        }

        .status.waiting {
            background: rgba(245, 158, 11, .18);
            color: #fbbf24;
        }

        .status.matched {
            background: rgba(16, 185, 129, .18);
            color: #34d399;
        }

        .status.cancelled,
        .status.failed {
            background: rgba(239, 68, 68, .18);
            color: #f87171;
        }

        .status.polling {
            background: rgba(96, 165, 250, .18);
            color: #93c5fd;
        }

        .log {
            background: #0b1220;
            border: 1px solid var(--line);
            border-radius: 10px;
            min-height: 220px;
            max-height: 340px;
            overflow: auto;
            padding: 12px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .kv {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 6px 10px;
            margin: 10px 0;
        }

        .kv div:nth-child(odd) {
            color: var(--muted);
            font-size: 12px;
        }

        .section-title {
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>AuthServer Match Test UI</h1>
        <p class="small">
            기능 테스트용 페이지입니다. 회원가입, 로그인, 매칭 참가, 상태 조회, 롱 폴링 wait 테스트를 한 화면에서 수행할 수 있습니다.
            <br>
            주석을 많이 넣어두었기 때문에 선생님께서 API 경로나 응답 구조를 바꾸실 때 수정하기 쉽도록 구성했습니다.
        </p>

        <div class="panel">
            <h2>공통 설정</h2>
            <div class="row">
                <div class="col-6">
                    <label for="baseUrl">API Base URL</label>
                    <input id="baseUrl" value="http://localhost:5289" />
                </div>
                <div class="col-2">
                    <label for="clientCount">클라이언트 수</label>
                    <input id="clientCount" type="number" min="1" max="50" value="15" />
                </div>
                <div class="col-2">
                    <label for="password">공통 비밀번호</label>
                    <input id="password" value="123456" />
                </div>
                <div class="col-2">
                    <label for="waitTimeoutSeconds">wait 타임아웃(참고)</label>
                    <input id="waitTimeoutSeconds" type="number" min="1" max="120" value="20" />
                </div>
                <div class="col-12">
                    <label for="namePrefix">아이디 Prefix</label>
                    <input id="namePrefix" value="player" />
                </div>
            </div>

            <div class="actions" style="margin-top: 12px;">
                <button onclick="generateClients()">클라이언트 생성</button>
                <button onclick="registerAll()">전체 회원가입</button>
                <button onclick="loginAll()">전체 로그인</button>
                <button onclick="joinFirstTen()">앞 10명 매칭 참가</button>
                <button onclick="joinAll()">전체 매칭 참가</button>
                <button onclick="refreshAllStatus()">전체 상태 조회</button>
                <button onclick="waitFirstTen()">앞 10명 wait</button>
                <button onclick="waitAll()">전체 wait</button>
                <button onclick="clearLog()">로그 지우기</button>
            </div>

            <p class="small" style="margin-top: 10px;">
                주석: FPS 5:5 테스트를 염두에 두고 앞 10명만 바로 매칭에 넣는 버튼을 포함했습니다.
                나머지 5명은 예비 인원 또는 다음 매치 테스트에 사용할 수 있습니다.
            </p>
        </div>

        <div class="panel">
            <h2>실행 로그</h2>
            <div id="log" class="log"></div>
        </div>

        <div class="panel">
            <h2>클라이언트 목록</h2>
            <div id="clientGrid" class="grid"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 기능 테스트용 전역 상태
        // ============================================================
        const state = {
            clients: []
        };

        // ============================================================
        // 공통 유틸
        // ============================================================
        function log(message) {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.textContent += `[${time}] ${message}\n`;
            el.scrollTop = el.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        function getBaseUrl() {
            // 주석: 끝의 / 는 제거해서 /auth/login 같은 경로를 안전하게 붙입니다.
            return document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
        }

        function getClient(index) {
            return state.clients.find(c => c.index === index);
        }

        function normalizeStatusClass(status, isWaitingCallActive) {
            if (isWaitingCallActive) return 'polling';
            const s = String(status || 'idle').toLowerCase();
            if (s === 'waiting') return 'waiting';
            if (s === 'matched') return 'matched';
            if (s === 'cancelled' || s === 'failed') return 'cancelled';
            return 'idle';
        }

        async function request(path, options = {}) {
            const url = `${getBaseUrl()}${path}`;
            const response = await fetch(url, options);

            let data = null;
            const text = await response.text();

            try {
                data = text ? JSON.parse(text) : null;
            } catch {
                data = text;
            }

            return { response, data };
        }

        function authHeaders(client, includeJson = true) {
            const headers = {
                Authorization: `Bearer ${client.token}`
            };

            if (includeJson) {
                headers['Content-Type'] = 'application/json';
            }

            return headers;
        }

        // ============================================================
        // 클라이언트 생성 / 렌더링
        // ============================================================
        function generateClients() {
            const count = Number(document.getElementById('clientCount').value);
            const prefix = document.getElementById('namePrefix').value.trim() || 'player';
            const password = document.getElementById('password').value;

            state.clients = Array.from({ length: count }, (_, i) => ({
                index: i + 1,
                username: `${prefix}${String(i + 1).padStart(2, '0')}`,
                password,
                token: '',
                registered: false,
                loggedIn: false,
                status: 'idle',
                waitingCallActive: false,
                userId: '',
                matchId: '',
                serverAddress: ''
            }));

            renderClients();
            log(`클라이언트 ${count}개 생성 완료`);
        }

        function renderClients() {
            const grid = document.getElementById('clientGrid');
            grid.innerHTML = '';

            state.clients.forEach(client => {
                const card = document.createElement('div');
                card.className = 'client-card';

                const statusClass = normalizeStatusClass(client.status, client.waitingCallActive);
                const statusLabel = client.waitingCallActive ? 'polling' : client.status;

                card.innerHTML = `
          <div class="top-line">
            <h3>#${client.index} ${client.username}</h3>
            <span class="status ${statusClass}">${statusLabel}</span>
          </div>

          <div class="small">registered: ${client.registered} / loggedIn: ${client.loggedIn}</div>

          <div class="section-title" style="margin-top: 12px;">상태 정보</div>
          <div class="kv mono">
            <div>userId</div><div>${client.userId || '-'}</div>
            <div>matchId</div><div>${client.matchId || '-'}</div>
            <div>server</div><div>${client.serverAddress || '-'}</div>
            <div>token</div><div>${client.token ? client.token.slice(0, 24) + '...' : '-'}</div>
          </div>

          <div class="actions" style="margin-top: 12px;">
            <button onclick="registerClient(${client.index})">회원가입</button>
            <button onclick="loginClient(${client.index})">로그인</button>
            <button onclick="joinClient(${client.index})">매칭 참가</button>
            <button onclick="statusClient(${client.index})">상태 조회</button>
            <button onclick="waitClient(${client.index})">wait</button>
            <button onclick="cancelClient(${client.index})">취소</button>
          </div>
        `;

                grid.appendChild(card);
            });
        }

        // ============================================================
        // 응답 구조 적용
        // 주석: 서버의 응답 DTO가 바뀌면 이 함수만 우선 수정하시면 됩니다.
        // ============================================================
        function applyStatus(client, data) {
            client.status = data?.status || client.status;
            client.userId = data?.userId || client.userId;
            client.matchId = data?.matchId || '';
            client.serverAddress = data?.serverAddress || '';
        }

        // ============================================================
        // 인증 관련
        // ============================================================
        async function registerClient(index) {
            const client = getClient(index);
            if (!client) return;

            const { response, data } = await request('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: client.username,
                    password: client.password
                })
            });

            if (response.ok) {
                client.registered = true;
                client.userId = data?.id || data?.userId || client.userId;
                log(`${client.username} 회원가입 성공`);
            } else if (response.status === 409) {
                client.registered = true;
                log(`${client.username} 이미 가입되어 있음(409)`);
            } else {
                log(`${client.username} 회원가입 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function loginClient(index) {
            const client = getClient(index);
            if (!client) return;

            const { response, data } = await request('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: client.username,
                    password: client.password
                })
            });

            if (response.ok) {
                client.loggedIn = true;
                client.token = data?.token || '';
                client.userId = data?.userId || client.userId;
                log(`${client.username} 로그인 성공`);
            } else {
                log(`${client.username} 로그인 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        // ============================================================
        // 매칭 관련 기본 API
        // ============================================================
        async function joinClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/join', {
                method: 'POST',
                headers: authHeaders(client)
            });

            if (response.ok) {
                applyStatus(client, data);
                if (!client.status || client.status === 'idle') {
                    client.status = 'Waiting';
                }
                log(`${client.username} 매칭 참가 성공`);
            } else {
                log(`${client.username} 매칭 참가 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function statusClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/status', {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${client.token}`
                }
            });

            if (response.ok) {
                applyStatus(client, data);
                log(`${client.username} 상태 조회 성공: ${client.status}`);
            } else {
                log(`${client.username} 상태 조회 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function cancelClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/cancel', {
                method: 'POST',
                headers: authHeaders(client)
            });

            if (response.ok) {
                applyStatus(client, data);
                log(`${client.username} 매칭 취소 성공`);
            } else {
                log(`${client.username} 매칭 취소 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        // ============================================================
        // 롱 폴링 wait 테스트
        // 주석:
        // 1) 서버에 GET /match/wait 가 있어야 동작합니다.
        // 2) 서버가 204를 반환하면 timeout으로 보고 종료합니다.
        // 3) 원하시면 여기서 자동 재호출 루프를 붙여서 계속 기다리게 만들 수 있습니다.
        // ============================================================
        async function waitClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            client.waitingCallActive = true;
            renderClients();

            try {
                const { response, data } = await request('/match/wait', {
                    method: 'GET',
                    headers: {
                        Authorization: `Bearer ${client.token}`
                    }
                });

                if (response.status === 204) {
                    log(`${client.username} wait timeout`);
                    return;
                }

                if (response.ok) {
                    applyStatus(client, data);
                    log(`${client.username} wait 완료: ${client.status}`);
                } else {
                    log(`${client.username} wait 실패: ${response.status} ${JSON.stringify(data)}`);
                }
            } catch (error) {
                log(`${client.username} wait 예외: ${error.message}`);
            } finally {
                client.waitingCallActive = false;
                renderClients();
            }
        }

        // ============================================================
        // 일괄 실행 함수
        // 주석: 기능 테스트용이므로 register/login은 순차 실행,
        // join/status/wait는 동시 실행으로 두었습니다.
        // ============================================================
        async function registerAll() {
            for (const client of state.clients) {
                await registerClient(client.index);
            }
        }

        async function loginAll() {
            for (const client of state.clients) {
                await loginClient(client.index);
            }
        }

        async function joinAll() {
            await Promise.all(state.clients.map(c => joinClient(c.index)));
        }

        async function joinFirstTen() {
            // 주석: 5:5 매치 테스트용 기본값입니다.
            const targets = state.clients.slice(0, 10);
            await Promise.all(targets.map(c => joinClient(c.index)));
        }

        async function refreshAllStatus() {
            await Promise.all(state.clients.map(c => statusClient(c.index)));
        }

        async function waitAll() {
            await Promise.all(state.clients.map(c => waitClient(c.index)));
        }

        async function waitFirstTen() {
            const targets = state.clients.slice(0, 10);
            await Promise.all(targets.map(c => waitClient(c.index)));
        }

        // ============================================================
        // 페이지 시작 시 기본 클라이언트 자동 생성
        // ============================================================
        generateClients();
    </script>
</body>

</html>/html>
