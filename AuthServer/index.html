<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AuthServer SignalR Match Test UI</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111827;
            --panel-2: #182234;
            --line: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --ok: #10b981;
            --warn: #f59e0b;
            --bad: #ef4444;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            max-width: 1520px;
            margin: 0 auto;
            padding: 20px;
        }

        h1,
        h2,
        h3,
        h4,
        p {
            margin-top: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 12px;
        }

        .col-2 {
            grid-column: span 2;
        }

        .col-3 {
            grid-column: span 3;
        }

        .col-4 {
            grid-column: span 4;
        }

        .col-6 {
            grid-column: span 6;
        }

        .col-12 {
            grid-column: span 12;
        }

        @media (max-width: 960px) {

            .col-2,
            .col-3,
            .col-4,
            .col-6,
            .col-12 {
                grid-column: span 12;
            }
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        input,
        button {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            font-weight: 700;
            transition: background-color .15s ease, transform .05s ease;
        }

        button:hover {
            background: #23324a;
        }

        button:active {
            transform: translateY(1px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .actions button {
            width: auto;
            min-width: 120px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        @media (max-width: 1180px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .client-card {
            background: #182234;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
        }

        .top-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .status.idle {
            background: rgba(148, 163, 184, .15);
            color: #cbd5e1;
        }

        .status.waiting {
            background: rgba(245, 158, 11, .18);
            color: #fbbf24;
        }

        .status.matched {
            background: rgba(16, 185, 129, .18);
            color: #34d399;
        }

        .status.cancelled,
        .status.failed {
            background: rgba(239, 68, 68, .18);
            color: #f87171;
        }

        .status.connected {
            background: rgba(96, 165, 250, .18);
            color: #93c5fd;
        }

        .status.disconnected {
            background: rgba(148, 163, 184, .18);
            color: #cbd5e1;
        }

        .log {
            background: #07111d;
            border: 1px solid var(--line);
            border-radius: 10px;
            min-height: 220px;
            max-height: 340px;
            overflow: auto;
            padding: 12px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .kv {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 6px 10px;
            margin: 10px 0;
        }

        .kv div:nth-child(odd) {
            color: var(--muted);
            font-size: 12px;
        }

        .section-title {
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--accent);
            font-weight: 800;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>AuthServer SignalR Match Test UI</h1>
        <p class="small">
            SignalR 기반 기능 테스트용 페이지입니다. 회원가입, 로그인, Hub 연결, 매칭 참가, 상태 조회를 한 화면에서 테스트할 수 있습니다.
            <br>
            주석을 자세히 넣어두었기 때문에 API 경로, Hub 경로, 응답 구조를 쉽게 수정할 수 있습니다.
        </p>

        <div class="panel">
            <h2>공통 설정</h2>
            <div class="row">
                <div class="col-6">
                    <label for="baseUrl">API Base URL</label>
                    <input id="baseUrl" value="http://localhost:5289" />
                </div>
                <div class="col-2">
                    <label for="clientCount">클라이언트 수</label>
                    <input id="clientCount" type="number" min="1" max="50" value="15" />
                </div>
                <div class="col-2">
                    <label for="password">공통 비밀번호</label>
                    <input id="password" value="123456" />
                </div>
                <div class="col-2">
                    <label for="hubPath">Hub Path</label>
                    <input id="hubPath" value="/hubs/match" />
                </div>
                <div class="col-12">
                    <label for="namePrefix">아이디 Prefix</label>
                    <input id="namePrefix" value="player" />
                </div>
            </div>

            <div class="actions" style="margin-top: 12px;">
                <button onclick="generateClients()">클라이언트 생성</button>
                <button onclick="registerAll()">전체 회원가입</button>
                <button onclick="loginAll()">전체 로그인</button>
                <button onclick="connectAllHub()">전체 Hub 연결</button>
                <button onclick="joinFirstTen()">앞 10명 매칭 참가</button>
                <button onclick="joinAll()">전체 매칭 참가</button>
                <button onclick="refreshAllStatus()">전체 상태 조회</button>
                <button onclick="disconnectAllHub()">전체 Hub 종료</button>
                <button onclick="clearLog()">로그 지우기</button>
            </div>

            <p class="small" style="margin-top: 10px;">
                주석: SignalR 테스트 순서는 보통 회원가입 → 로그인 → Hub 연결 → 매칭 참가입니다.
                매칭 완료 이벤트는 서버가 <span class="mono">Matched</span> 이름으로 push한다고 가정합니다.
            </p>
        </div>

        <div class="panel">
            <h2>실행 로그</h2>
            <div id="log" class="log"></div>
        </div>

        <div class="panel">
            <h2>클라이언트 목록</h2>
            <div id="clientGrid" class="grid"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script>
        // ============================================================
        // 전역 상태
        // ============================================================
        const state = {
            clients: []
        };

        // ============================================================
        // 공통 유틸
        // ============================================================
        function log(message) {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.textContent += `[${time}] ${message}\n`;
            el.scrollTop = el.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        function getBaseUrl() {
            return document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
        }

        function getHubPath() {
            return document.getElementById('hubPath').value.trim() || '/hubs/match';
        }

        function getClient(index) {
            return state.clients.find(c => c.index === index);
        }

        function normalizeStatusClass(status) {
            const s = String(status || 'idle').toLowerCase();
            if (s === 'waiting') return 'waiting';
            if (s === 'matched') return 'matched';
            if (s === 'cancelled' || s === 'failed') return 'cancelled';
            return 'idle';
        }

        function normalizeHubStatusClass(isConnected) {
            return isConnected ? 'connected' : 'disconnected';
        }

        async function request(path, options = {}) {
            const url = `${getBaseUrl()}${path}`;
            const response = await fetch(url, options);

            let data = null;
            const text = await response.text();
            try {
                data = text ? JSON.parse(text) : null;
            } catch {
                data = text;
            }

            return { response, data };
        }

        function authHeaders(client, includeJson = true) {
            const headers = {
                Authorization: `Bearer ${client.token}`
            };

            if (includeJson) {
                headers['Content-Type'] = 'application/json';
            }

            return headers;
        }

        // ============================================================
        // 클라이언트 생성 / 렌더링
        // ============================================================
        function generateClients() {
            const count = Number(document.getElementById('clientCount').value);
            const prefix = document.getElementById('namePrefix').value.trim() || 'player';
            const password = document.getElementById('password').value;

            state.clients = Array.from({ length: count }, (_, i) => ({
                index: i + 1,
                username: `${prefix}${String(i + 1).padStart(2, '0')}`,
                password,
                token: '',
                registered: false,
                loggedIn: false,
                hubConnected: false,
                hubConnection: null,
                status: 'idle',
                userId: '',
                matchId: '',
                serverAddress: ''
            }));

            renderClients();
            log(`클라이언트 ${count}개 생성 완료`);
        }

        function renderClients() {
            const grid = document.getElementById('clientGrid');
            grid.innerHTML = '';

            state.clients.forEach(client => {
                const card = document.createElement('div');
                card.className = 'client-card';

                card.innerHTML = `
          <div class="top-line">
            <h3>#${client.index} ${client.username}</h3>
            <span class="status ${normalizeStatusClass(client.status)}">${client.status}</span>
          </div>

          <div class="top-line" style="margin-bottom: 0;">
            <div class="small">registered: ${client.registered} / loggedIn: ${client.loggedIn}</div>
            <span class="status ${normalizeHubStatusClass(client.hubConnected)}">hub: ${client.hubConnected ? 'connected' : 'disconnected'}</span>
          </div>

          <div class="section-title" style="margin-top: 12px;">상태 정보</div>
          <div class="kv mono">
            <div>userId</div><div>${client.userId || '-'}</div>
            <div>matchId</div><div>${client.matchId || '-'}</div>
            <div>server</div><div>${client.serverAddress || '-'}</div>
            <div>token</div><div>${client.token ? client.token.slice(0, 24) + '...' : '-'}</div>
          </div>

          <div class="actions" style="margin-top: 12px;">
            <button onclick="registerClient(${client.index})">회원가입</button>
            <button onclick="loginClient(${client.index})">로그인</button>
            <button onclick="connectHub(${client.index})">Hub 연결</button>
            <button onclick="joinClient(${client.index})">매칭 참가</button>
            <button onclick="statusClient(${client.index})">상태 조회</button>
            <button onclick="cancelClient(${client.index})">취소</button>
            <button onclick="disconnectHub(${client.index})">Hub 종료</button>
          </div>
        `;

                grid.appendChild(card);
            });
        }

        // ============================================================
        // 서버 응답 반영
        // 주석: DTO 구조가 바뀌면 이 함수만 우선 수정하시면 됩니다.
        // ============================================================
        function applyStatus(client, data) {
            client.status = data?.status || client.status;
            client.userId = data?.userId || client.userId;
            client.matchId = data?.matchId || '';
            client.serverAddress = data?.serverAddress || '';
        }

        function applyMatchedEvent(client, payload) {
            // 주석: 서버가 SignalR로 보내는 Matched 이벤트 payload 구조가 바뀌면 여기 수정
            client.status = payload?.status || 'Matched';
            client.userId = payload?.userId || client.userId;
            client.matchId = payload?.matchId || client.matchId;
            client.serverAddress = payload?.serverAddress || client.serverAddress;
        }

        // ============================================================
        // 인증 API
        // ============================================================
        async function registerClient(index) {
            const client = getClient(index);
            if (!client) return;

            const { response, data } = await request('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: client.username,
                    password: client.password
                })
            });

            if (response.ok) {
                client.registered = true;
                client.userId = data?.id || data?.userId || client.userId;
                log(`${client.username} 회원가입 성공`);
            } else if (response.status === 409) {
                client.registered = true;
                log(`${client.username} 이미 가입되어 있음(409)`);
            } else {
                log(`${client.username} 회원가입 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function loginClient(index) {
            const client = getClient(index);
            if (!client) return;

            const { response, data } = await request('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: client.username,
                    password: client.password
                })
            });

            if (response.ok) {
                client.loggedIn = true;
                client.token = data?.token || '';
                client.userId = data?.userId || client.userId;
                log(`${client.username} 로그인 성공`);
            } else {
                log(`${client.username} 로그인 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        // ============================================================
        // SignalR 연결
        // 주석:
        // 1) 서버 Program.cs에서 /hubs/match 로 MapHub 되어 있어야 합니다.
        // 2) JWT를 query string access_token 으로 받는 설정이 필요합니다.
        // ============================================================
        async function connectHub(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            if (client.hubConnection) {
                log(`${client.username} 이미 Hub 객체가 존재함`);
                return;
            }

            const hubUrl = `${getBaseUrl()}${getHubPath()}`;

            const connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, {
                    accessTokenFactory: () => client.token
                })
                .withAutomaticReconnect()
                .build();

            connection.on('Matched', payload => {
                applyMatchedEvent(client, payload);
                log(`${client.username} Matched 이벤트 수신: matchId=${payload?.matchId || '-'} status=${payload?.status || '-'}`);
                renderClients();
            });

            connection.on('Pong', payload => {
                log(`${client.username} Pong 수신: ${JSON.stringify(payload)}`);
            });

            connection.onreconnecting(error => {
                client.hubConnected = false;
                renderClients();
                log(`${client.username} Hub 재연결 시도 중: ${error?.message || 'unknown error'}`);
            });

            connection.onreconnected(() => {
                client.hubConnected = true;
                renderClients();
                log(`${client.username} Hub 재연결 성공`);
            });

            connection.onclose(error => {
                client.hubConnected = false;
                client.hubConnection = null;
                renderClients();
                log(`${client.username} Hub 종료됨: ${error?.message || 'closed'}`);
            });

            try {
                await connection.start();
                client.hubConnection = connection;
                client.hubConnected = true;
                log(`${client.username} Hub 연결 성공`);

                // 주석: 서버 Hub에 Ping 메서드가 있으면 연결 확인용으로 호출합니다.
                try {
                    await connection.invoke('Ping');
                } catch (pingError) {
                    log(`${client.username} Ping 실패(무시 가능): ${pingError.message}`);
                }
            } catch (error) {
                log(`${client.username} Hub 연결 실패: ${error.message}`);
            }

            renderClients();
        }

        async function disconnectHub(index) {
            const client = getClient(index);
            if (!client || !client.hubConnection) {
                log(`#${index} Hub 연결 없음`);
                return;
            }

            try {
                await client.hubConnection.stop();
                client.hubConnection = null;
                client.hubConnected = false;
                log(`${client.username} Hub 연결 종료`);
            } catch (error) {
                log(`${client.username} Hub 종료 실패: ${error.message}`);
            }

            renderClients();
        }

        // ============================================================
        // 매칭 API
        // ============================================================
        async function joinClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/join', {
                method: 'POST',
                headers: authHeaders(client)
            });

            if (response.ok) {
                applyStatus(client, data);
                if (!client.status || client.status === 'idle') {
                    client.status = 'Waiting';
                }
                log(`${client.username} 매칭 참가 성공`);
            } else {
                log(`${client.username} 매칭 참가 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function statusClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/status', {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${client.token}`
                }
            });

            if (response.ok) {
                applyStatus(client, data);
                log(`${client.username} 상태 조회 성공: ${client.status}`);
            } else {
                log(`${client.username} 상태 조회 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        async function cancelClient(index) {
            const client = getClient(index);
            if (!client || !client.token) {
                log(`#${index} 로그인 토큰 없음`);
                return;
            }

            const { response, data } = await request('/match/cancel', {
                method: 'POST',
                headers: authHeaders(client)
            });

            if (response.ok) {
                applyStatus(client, data);
                log(`${client.username} 매칭 취소 성공`);
            } else {
                log(`${client.username} 매칭 취소 실패: ${response.status} ${JSON.stringify(data)}`);
            }

            renderClients();
        }

        // ============================================================
        // 일괄 실행
        // ============================================================
        async function registerAll() {
            for (const client of state.clients) {
                await registerClient(client.index);
            }
        }

        async function loginAll() {
            for (const client of state.clients) {
                await loginClient(client.index);
            }
        }

        async function connectAllHub() {
            for (const client of state.clients) {
                await connectHub(client.index);
            }
        }

        async function disconnectAllHub() {
            for (const client of state.clients) {
                await disconnectHub(client.index);
            }
        }

        async function joinAll() {
            await Promise.all(state.clients.map(c => joinClient(c.index)));
        }

        async function joinFirstTen() {
            const targets = state.clients.slice(0, 10);
            await Promise.all(targets.map(c => joinClient(c.index)));
        }

        async function refreshAllStatus() {
            await Promise.all(state.clients.map(c => statusClient(c.index)));
        }

        // ============================================================
        // 시작 시 기본 15명 생성
        // ============================================================
        generateClients();
    </script>
</body>

</html>
