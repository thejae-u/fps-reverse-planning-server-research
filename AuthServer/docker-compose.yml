services:
  redis:
    image: redis:alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  auth-server:
    image: auth-server-dev
    container_name: auth-server
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    # 핫리로드 없이 서버 상시 실행
    command: dotnet run --project /workspace/AuthServer.csproj --urls http://0.0.0.0:8080
    ports:
      - "5289:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Redis__ConnectionString: redis:6379
    volumes:
      - ./:/workspace
      - nuget-packages:/home/vscode/.nuget/packages
      # 빌드 폴더 격리 유지
      - /workspace/bin
      - /workspace/obj
    depends_on:
      - redis
    stdin_open: true
    tty: true

volumes:
  nuget-packages:
  redis-data:
