services:
  redis:
    image: redis:alpine
    container_name: auth-redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data

  db:
    image: postgres:16-alpine
    container_name: auth-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
    # ports removed for security (only accessible within docker network)
    volumes:
      - db-data:/var/lib/postgresql/data

  auth-server:
    image: auth-server-dev
    container_name: auth-server
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    # 서버 자동 실행 대신 컨테이너만 유지 (사용자가 터미널에서 직접 dotnet run/watch 실행)
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "5289:8080"
      - "5290:8081"
      - "127.0.0.1:9000:9000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Redis__ConnectionString: redis:6379
      Jwt__SecretKey: ${JWT_SECRET_KEY:-THIS_IS_A_TEMPORARY_SECRET_KEY_FOR_DEVELOPMENT_ONLY}
      ConnectionStrings__DefaultConnection: "Host=db;Database=${POSTGRES_DB:-authdb};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-password123}"
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      - ./:/workspace
      - nuget-packages:/home/vscode/.nuget/packages
    depends_on:
      - redis
      - db
    stdin_open: true
    tty: true

volumes:
  nuget-packages:
  redis-data:
  db-data:
