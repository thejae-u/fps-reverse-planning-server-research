services:
  redis:
    image: redis:alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  auth-server:
    image: auth-server-dev
    container_name: auth-server
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    # 서버 자동 실행 대신 컨테이너만 유지 (사용자가 터미널에서 직접 dotnet run/watch 실행)
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "5289:8080"
      - "5290:8081" # HTTPS를 위한 추가 포트 매핑 (선택사항)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Redis__ConnectionString: redis:6379
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      - ./:/workspace
      - nuget-packages:/home/vscode/.nuget/packages
    depends_on:
      - redis
    stdin_open: true
    tty: true

volumes:
  nuget-packages:
  redis-data:
